<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>zDashboard</title>
    <link rel="stylesheet" href="style.css?v=__ASSET_VER__">
</head>
<body>

<!-- ===== 竖屏布局 ===== -->
<div id="scroller">
    <!-- 顶部状态栏（竖屏：sticky吸顶） -->
    <div class="dash-bar sticky" id="barP">
        <div class="logo"><span class="z">Z</span>Dash</div>
        <div class="spacer"></div>
        <div class="si"><span class="d" style="background:var(--blu)"></span>台账 <span class="v" id="statDbP">—</span></div>
        <div class="si"><span class="d" style="background:var(--grn)"></span>未读 <span class="v" id="statUnreadP">—</span></div>
        <div class="si"><span class="d" style="background:var(--org)"></span><span class="v" id="statVerP">—</span></div>
        <div class="spacer"></div>
        <span class="clk" id="clockP"></span>
        <span class="online-dot"></span>
    </div>
    <!-- 面板内容（Projects列表 + Tools列表；由 app.js 的 renderPanels() 生成，避免双份硬编码漂移） -->
    <div class="panel-content" id="panelP" style="background:var(--bg);border-bottom:1px solid var(--bdr)">
        <div class="sec-title">Projects</div>
        <div id="projectsP"></div>
        <div class="sec-div"></div>
        <div class="sec-title">Tools</div>
        <div id="toolsP"></div>
    </div>
    <!-- 主显示区 -->
    <div class="main-screen" id="screenP">
        <div class="ms-ph">
            <span class="b">&#x25A1;</span>
            1 : 1
        </div>
    </div>
    <!-- 底部弹性空间 -->
    <div id="portSpacer" style="flex-shrink:0"></div>
</div>

<!-- ===== 横屏布局 ===== -->
<div id="landscape" style="display:flex">
    <!-- 左栏 -->
    <div class="ls-left">
        <!-- 顶部状态栏（横屏：不吸顶） -->
        <div class="dash-bar" id="barL">
            <div class="logo"><span class="z">Z</span>Dash</div>
            <div class="spacer"></div>
            <div class="si"><span class="d" style="background:var(--blu)"></span>台账 <span class="v" id="statDbL">—</span></div>
            <div class="si"><span class="d" style="background:var(--grn)"></span>未读 <span class="v" id="statUnreadL">—</span></div>
            <div class="si"><span class="d" style="background:var(--org)"></span><span class="v" id="statVerL">—</span></div>
            <div class="spacer"></div>
            <span class="clk" id="clockL"></span>
            <span class="online-dot"></span>
        </div>
        <!-- 面板内容（横屏下可独立滚动） -->
        <div class="panel-content" id="panelL">
            <div class="sec-title">Projects</div>
            <div id="projectsL"></div>
            <div class="sec-div"></div>
            <div class="sec-title">Tools</div>
            <div id="toolsL"></div>
        </div>
    </div>
    <!-- 右栏：主显示区容器 -->
    <div class="ls-right" id="lsRight">
        <div class="main-screen" id="screenL">
            <div class="ms-ph">
                <span class="b">&#x25A1;</span>
                1 : 1
            </div>
        </div>
    </div>
</div>

<script type="module" src="app.js?v=__ASSET_VER__"></script>

</body>
</html>
